<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../toast/toast.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="login-box">

    <h1>Criar Conta</h1>

    <input
        type="text"
        id="nome"
        placeholder="Nome"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="senha"
        placeholder="Senha"
    >

    <input
        type="text"
        id="codigo"
        placeholder="Código de influencer"
    >

    <button onclick="registrar()">
        Criar Conta
    </button>

    <p class="registrar">
        Já possui conta?

        <a href="login.html">
            Fazer login
        </a>
    </p>

</div>

<script src="../toast/toast.js"></script>
<script src="registro.js"></script>

</body>
</html>
