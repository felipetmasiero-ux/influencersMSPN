<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../toast/toast.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="login-box">

    <h1>MAIS PANO</h1>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="senha"
        placeholder="Senha"
    >

    <button id="btnLogin" onclick="login()">
        Entrar
    </button>

    <p class="registrar">
        Não possui conta?

        <a href="registro.html">
            Criar conta
        </a>
    </p>

</div>

<script src="../toast/toast.js"></script>
<script src="login.js"></script>

</body>
</html>
