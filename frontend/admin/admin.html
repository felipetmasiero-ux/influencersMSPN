<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Admin - MAIS PANO</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../toast/toast.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <main class="admin">

        <header class="topo">

            <h1>Painel Admin</h1>

            <button onclick="abrirModal()">
                + Novo Produto
            </button>

        </header>

        <section class="cards">

            <div class="card">
                <h3>Faturamento</h3>
                <p id="faturamento">R$ 0</p>
            </div>

            <div class="card">
                <h3>Pedidos</h3>
                <p id="totalPedidos">0</p>
            </div>

            <div class="card">
                <h3>Comissão</h3>
                <p id="comissao">R$ 0</p>
            </div>

            <div class="card">
                <h3>Ticket Médio</h3>
                <p id="ticketMedio">R$ 0</p>
            </div>

            <div class="analytics-funnel">

                <div class="card">
                    <h3>Add To Cart</h3>
                    <p id="addToCart">0</p>
                </div>

                <div class="card">
                    <h3>Coupon Uses</h3>
                    <p id="couponUses">0</p>
                </div>

                <div class="card">
                    <h3>Purchases</h3>
                    <p id="purchases">0</p>
                </div>

                <div class="card">
                    <h3>Conversion Rate</h3>
                    <p id="conversionRate">0%</p>
                </div>

            </div>

            <section class="top-produtos">

                <h2>🔥 Produtos Mais Vendidos</h2>

                <div id="listaTopProdutos">

                </div>

            </section>

        </section>

        <section class="tabela-container">

            <table>

                <thead>

                    <tr>
                        <th>Imagem</th>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="tabelaProdutos">

                </tbody>

            </table>

        </section>

    </main>

    <!-- MODAL -->

    <div class="modal hidden" id="modal">

        <div class="modal-content">

            <h2>Novo Produto</h2>

            <input
                type="text"
                id="nome"
                placeholder="Nome"
            >

            <input
                type="number"
                id="preco"
                placeholder="Preço"
            >

            <input
                type="file"
                id="imagem"
                accept="image/*"
            >

            <img
                id="previewImagem"
                class="preview hidden"
            />

            <button
                id="btnSalvar"
                onclick="criarProduto()"
            >
                Salvar
            </button>

        </div>

    </div>

<script src="toast.js"></script>
<script src="admin.js"></script>

</body>
</html>
